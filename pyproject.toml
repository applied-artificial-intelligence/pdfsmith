[project]
name = "pdfsmith"
dynamic = ["version"]
description = "PDF to Markdown conversion with multiple backend support"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Applied AI", email = "info@applied-ai.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["pdf", "markdown", "text extraction", "document processing", "ocr"]

dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0"]
# Lightweight backends (no ML dependencies)
pypdf = ["pypdf>=4.0"]
pdfplumber = ["pdfplumber>=0.10"]
pymupdf = ["pymupdf>=1.24.3"]
pdfminer = ["pdfminer.six>=20221105"]
pypdfium2 = ["pypdfium2>=4.0"]

# Medium-weight backends
pymupdf4llm = ["pymupdf4llm>=1.28,<1.29"]
unstructured = ["unstructured[pdf]>=0.27.27,<0.28; python_version >= '3.11' and python_version < '3.14'", "pypdf>=4.0"]
kreuzberg = ["kreuzberg>=4.10.4,<4.11", "pypdf>=4.0"]
extractous = ["extractous>=0.3,<0.4", "pypdf>=4.0"]

# Heavy backends (ML/deep learning)
docling = ["docling>=2.139,<2.140", "pypdf>=4.0"]
marker = ["marker-pdf==2.0.0", "surya-ocr==0.22.1", "pypdf>=4.0"]

# Commercial backends (cloud OCR)
aws = ["boto3>=1.43,<1.44", "pymupdf>=1.24.3", "pypdf>=4.0"]
azure = ["azure-ai-documentintelligence>=1.0.2,<1.1", "pypdf>=4.0"]
google = ["google-cloud-documentai>=3.16,<3.17", "google-cloud-storage>=3.17,<3.18", "pypdf>=4.0"]
databricks = ["databricks-sdk>=0.116,<0.117", "pypdf>=4.0"]
llamaparse = ["llama-cloud>=2.18,<2.19", "pypdf>=4.0"]

# Frontier LLM backends
anthropic = ["anthropic>=1.15,<1.16", "pypdf>=4.0"]
openai = ["openai>=3.31,<3.32", "pypdf>=4.0"]
gemini = ["google-genai>=2.31,<2.32", "pypdf>=4.0"]
frontier = ["pypdf>=4.0", "anthropic>=1.15,<1.16", "openai>=3.31,<3.32", "google-genai>=2.31,<2.32"]

# Bundles
light = ["pypdf>=4.0", "pdfplumber>=0.10", "pymupdf>=1.24.3"]
recommended = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "pymupdf4llm>=1.28,<1.29",
    "kreuzberg>=4.10.4,<4.11",
]
commercial = [
    "boto3>=1.43,<1.44",
    "pymupdf>=1.24.3",
    "azure-ai-documentintelligence>=1.0.2,<1.1",
    "google-cloud-documentai>=3.16,<3.17",
    "google-cloud-storage>=3.17,<3.18",
    "databricks-sdk>=0.116,<0.117",
    "llama-cloud>=2.18,<2.19",
    "pypdf>=4.0",
]
all = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "pymupdf>=1.24.3",
    "pdfminer.six>=20221105",
    "pypdfium2>=4.0",
    "pymupdf4llm>=1.28,<1.29",
    "unstructured[pdf]>=0.27.27,<0.28; python_version >= '3.11' and python_version < '3.14'",
    "kreuzberg>=4.10.4,<4.11",
    "extractous>=0.3,<0.4",
    "docling>=2.139,<2.140",
    # Note: Commercial backends excluded from 'all' due to credential requirements
]

# Development
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff==0.6.0",
    "mypy>=1.11",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",  # Type stubs for mypy
    "PyYAML>=6.0",
    "packaging>=24.0",
    "pre-commit>=3.0",
    "reportlab>=4.0",  # For creating test PDFs
]

[project.urls]
Homepage = "https://github.com/applied-artificial-intelligence/pdfsmith"
Documentation = "https://github.com/applied-artificial-intelligence/pdfsmith#readme"
Repository = "https://github.com/applied-artificial-intelligence/pdfsmith"
Issues = "https://github.com/applied-artificial-intelligence/pdfsmith/issues"

[project.scripts]
pdfsmith = "pdfsmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsmith"]

[tool.hatch.build.targets.sdist]
only-include = ["src/pdfsmith", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.hatch.version]
path = "src/pdfsmith/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
    "commercial: marks tests requiring commercial backend credentials",
    "aws: marks tests requiring AWS credentials",
    "azure: marks tests requiring Azure credentials",
    "google: marks tests requiring Google Cloud credentials",
    "databricks: marks tests requiring Databricks credentials",
    "llamaparse: marks tests requiring LlamaParse API key",
    "anthropic: marks tests requiring Anthropic API key",
    "openai: marks tests requiring OpenAI API key",
    "gemini: marks tests requiring Google/Gemini API key",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
files = ["src/pdfsmith"]

[tool.coverage.run]
source = ["src/pdfsmith"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # These lines only execute when package is not installed
    "except ImportError:",
    "AVAILABLE = False",
    "raise ImportError",
]

[tool.uv]
# 1.24.x has neither a CPython 3.10 wheel nor an sdist.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]
conflicts = [
    [{ extra = "marker" }, { extra = "unstructured" }],
    [{ extra = "marker" }, { extra = "all" }],
    [{ extra = "marker" }, { extra = "anthropic" }],
    [{ extra = "marker" }, { extra = "openai" }],
    [{ extra = "marker" }, { extra = "frontier" }],
]
