name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12 --extra dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync mypy src --ignore-missing-imports

  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - name: Install non-editable package and offline test dependencies
        run: >-
          uv sync --locked --no-editable --python ${{ matrix.python-version }}
          --extra dev --extra light --extra pymupdf4llm --extra pdfminer
          --extra pypdfium2 --extra commercial --extra frontier
      - name: Run local and SDK transport contracts without provider credentials
        run: uv run --no-sync pytest -q --tb=short

  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - name: Build source distribution and wheel
        run: uv build
      - name: Install core wheel in an empty environment
        run: |
          uv venv --python ${{ matrix.python-version }} .package-check
          uv pip install --python .package-check/bin/python dist/*.whl
      - name: Check installed identity, console and archive contents
        run: >-
          .package-check/bin/python -I tests/verify_distribution.py
          --wheel dist/*.whl
          --sdist dist/*.tar.gz
          --result distribution-result.json
